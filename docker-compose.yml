version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: serveradmin-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # 生产建议开启认证后同步修改应用侧 SA_MONGO_URI
    # command: ["--auth"]

  serveradmin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serveradmin
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      SA_MONGO_URI: "mongodb://mongo:27017"
      SA_APP_PORT: "8080"
      # SA_JWT_SECRET: "please-change-me"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs

volumes:
  mongo_data:
  uploads:
  logs:
